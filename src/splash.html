<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #050507; overflow: hidden;
      font-family: -apple-system, "PingFang SC", sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 38%, #1c1c22 0%, #0a0a0e 55%, #050507 100%); }
    .whale { width: 84px; height: 84px; margin-bottom: 22px;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
    h1 { color: #f2d488; font-size: 17px; font-weight: 600; letter-spacing: .5px; margin-bottom: 4px; }
    .sub { color: #8b8577; font-size: 11.5px; margin-bottom: 26px; letter-spacing: .3px; }
    .track { width: 300px; height: 6px; border-radius: 3px; background: rgba(232,200,119,.14);
      overflow: hidden; position: relative; }
    .bar { position: absolute; inset: 0 auto 0 0; width: 4%;
      border-radius: 3px;
      background: linear-gradient(90deg, #c19134, #f0ce74, #f9e7a0);
      transition: width .45s cubic-bezier(.32,.72,.34,1); }
    .bar::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 24px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5)); border-radius: 3px; }
    .status { margin-top: 14px; color: #9a937f; font-size: 12px; min-height: 16px; }
    .ring { position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(232,200,119,.35), transparent);
      animation: sweep 2.2s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-100%);} 100% { transform: translateX(100%);} }
    .err { color: #d98c8c; }
  </style>
</head>
